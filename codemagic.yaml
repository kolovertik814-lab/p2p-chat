workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android project structure if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --org com.p2p.chat --template=app
          fi
      - name: Force compileSdkVersion 36 for all plugins
        script: |
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") || plugins.hasPlugin("com.android.library")) {
                      configure<com.android.build.gradle.BaseExtension> {
                          compileSdkVersion(36)
                      }
                  }
              }
          }
          EOF
      - name: Clean and Get dependencies
        script: |
          flutter clean
          flutter pub get
      - name: Build APK via Flutter CLI
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/release/*.apk
