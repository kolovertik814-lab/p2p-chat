workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android project structure if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --org com.p2p.chat --template=app
          fi
      - name: Force compileSdk 36 and repositories
        script: |
          cat << 'EOF' >> android/build.gradle

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
      - name: Build APK via Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - build/app/outputs/apk/release/*.apk
      - build/app/outputs/flutter-apk/*.apk
