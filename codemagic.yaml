workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Recreate Android directory for clean state
        script: |
          rm -rf android
          flutter create . --org com.p2p.chat --template=app
      - name: Force compileSdkVersion 36 for all subprojects
        script: |
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              plugins.withId("com.android.library") {
                  (property("android") as? com.android.build.gradle.BaseExtension)?.compileSdkVersion(36)
              }
              plugins.withId("com.android.application") {
                  (property("android") as? com.android.build.gradle.BaseExtension)?.compileSdkVersion(36)
              }
          }
          EOF
      - name: Clean and Get dependencies
        script: |
          flutter clean
          flutter pub get
      - name: Build APK via Flutter CLI
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/release/*.apk
