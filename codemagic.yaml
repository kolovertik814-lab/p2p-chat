workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android project structure if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --org com.p2p.chat --template=app
          fi
      - name: Force compileSdk 36 for all subprojects
        script: |
          echo "" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    afterEvaluate { project ->" >> android/build.gradle
          echo "        if (project.hasProperty('android')) {" >> android/build.gradle
          echo "            project.android {" >> android/build.gradle
          echo "                compileSdkVersion 36" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
