workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Recreate Android directory
        script: |
          rm -rf android
          flutter create . --org com.p2p.chat --template=app
      - name: Clean, Get dependencies and patch plugins
        script: |
          flutter clean
          flutter pub get
          find "$HOME/.pub-cache" -name "build.gradle*" -exec perl -pi -e 's/compileSdk(Version)?\s*=?\s*\d+/compileSdkVersion 36/g' {} +
      - name: Build APK via Flutter CLI
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/release/*.apk
